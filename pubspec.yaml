name: solgasdelivery
description: Proyecto Flutter Web con deploy automático a Firebase Hosting
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 🔹 Aquí tus dependencias normales
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.2.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1   # 👈 bajado para compatibilidad

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path: ^1.9.0   # 👈 forzamos compatibilidad entre splash y test

flutter:
  uses-material-design: true
