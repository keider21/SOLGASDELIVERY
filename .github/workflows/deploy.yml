name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main
      - 'sprint/**'   # 👈 habilitamos deploy también en ramas sprint/*

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'   # ajusta si necesitas otra versión

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLGASDELIVERY_69729 }}'
          channelId: live
          projectId: solgasdelivery-69729
